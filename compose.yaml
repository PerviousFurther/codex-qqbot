name: llm-watch-video

services:
  bot:
    build:
      context: .
      args:
        WATCH_AUDIO_RUNTIME: "true"
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - egress
      - snowluma
    stop_grace_period: 20s
    env_file:
      - .env
    environment:
      HOME: /data
      CODEX_HOME: /data/codex
      WATCH_CODEX_HOME: /data/codex
      WATCH_DATA_DIR: /data/state
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      WATCH_AUDIO_MODEL_DIR: ${WATCH_AUDIO_MODEL_DIR:-/models/sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25}
      WATCH_AUDIO_VAD_MODEL: ${WATCH_AUDIO_VAD_MODEL:-/models/silero_vad.onnx}
    volumes:
      - type: bind
        source: ./runtime
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./models
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WATCH_HOST_PROJECT_DIR:-.}
        target: /workspace/project
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WATCH_HOST_OPENAI_DIR:-/home/YUE___/.nvm/versions/node/v24.22.1/lib/node_modules/@openai}
        target: /opt/host-openai
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${WATCH_HOST_BROWSERS_DIR:-/home/YUE___/cloudcli-docker/data/home/.cache/ms-playwright}
        target: /ms-playwright
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,nosuid,size=512m,mode=1777
    shm_size: 256m
    mem_limit: ${WATCH_MEMORY_LIMIT:-2g}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  snowluma:
    # Upstream latest resolved on 2026-10-29; pin the multi-platform manifest.
    image: motricseven7/snowluma@sha256:29536cd34e9c9c3f8a942be4e5cd6a17d366acd9b2096aa56b5863d024a80d23
    restart: unless-stopped
    shm_size: 1gb
    mem_limit: 1536m
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    environment:
      TZ: Asia/Shanghai
      SNOWLUMA_UID: "1000"
      SNOWLUMA_GID: "1000"
      SNOWLUMA_WEBUI_HOST: 0.0.0.0
      SNOWLUMA_WEBUI_PORT: "5099"
      SNOWLUMA_ONEBOT_HOST: 0.0.0.0
      SNOWLUMA_LOG_LEVEL: info
      SNOWLUMA_SCREEN: 1280x800x24
      SNOWLUMA_HOOK_AUTOLOAD: "1"
      SNOWLUMA_QQ_FLAGS: --disable-gpu --disable-software-rasterizer --disable-gpu-compositing
    networks:
      - snowluma
    ports:
      - "127.0.0.1:16081:6081"
      - "127.0.0.1:15099:5099"
    volumes:
      - gateway-data:/app/data
      - qq-config:/app/.config
      - qq-data:/app/.local/share
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

networks:
  egress:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd73:83c1:9b4b::/64

  snowluma:
    external: true
    name: llm-snowluma-trial_default

# Reuse the existing QQ login/configuration volumes; never create replacement volumes.
volumes:
  gateway-data:
    external: true
    name: llm-snowluma-trial_gateway-data
  qq-config:
    external: true
    name: llm-snowluma-trial_qq-config
  qq-data:
    external: true
    name: llm-snowluma-trial_qq-data
